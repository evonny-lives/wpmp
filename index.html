<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maquinarias Pineda — WhatsApp</title>
  <meta name="description" content="Escríbenos por WhatsApp y recibe información de nuestras máquinas." />
  <meta name="robots" content="noindex, nofollow" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg: #0d0d0d;
      --card: #161616;
      --border: #2a2a2a;
      --green: #25D366;
      --green-dim: #1aab52;
      --text: #f0ede8;
      --muted: #888;
      --radius: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 36px 40px;
      max-width: 400px;
      width: calc(100% - 32px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 260px; height: 120px;
      background: radial-gradient(ellipse, rgba(37,211,102,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .icon-wrap {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 32px rgba(37,211,102,0.3);
    }
    .icon-wrap svg { width: 38px; height: 38px; fill: #fff; }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(37,211,102,0.1);
      border: 1px solid rgba(37,211,102,0.2);
      border-radius: 100px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    h1 span { color: var(--green); }

    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: var(--green-dim); }
    .btn:active { transform: scale(0.97); }
    .btn svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }

    .footer { margin-top: 24px; margin-bottom: 0; font-size: 12px; color: #555; }

    .status { display: none; font-size: 13px; color: var(--green); margin-top: 16px; }
    .status.visible { display: block; }
  </style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">

    </svg>
  </div>

  <div class="tag">Maquinarias Pineda</div>

  <p>Escríbenos y te damos precios, modelos y disponibilidad. Atención directa y rápida.</p>
